<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNE ADMIN | 판매자 통합 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">

    <!-- 登录框 (默认密码: 1234) -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-stone-950 flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="text-center">
                <h1 class="text-lg font-bold tracking-widest">LUNE ADMIN</h1>
                <p class="text-xs text-stone-500 mt-1">판매자 전용 관리자 페이지</p>
            </div>
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">관리자 비밀번호</label>
                <input id="admin-pw" type="password" placeholder="비밀번호 입력 (기본: 1234)" onkeydown="if(event.key==='Enter') checkLogin()" class="w-full border border-stone-300 rounded-lg px-3 py-2.5 text-sm">
            </div>
            <button onclick="checkLogin()" class="w-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold py-3 rounded-lg transition">
                관리자 로그인
            </button>
        </div>
    </div>

    <!-- 后台主界面 -->
    <div id="dashboard" class="hidden">
        <nav class="bg-stone-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 shadow-md">
            <div class="flex items-center space-x-3">
                <span class="font-bold tracking-widest text-base">LUNE ADMIN</span>
                <span class="text-xs bg-rose-500 px-2 py-0.5 rounded font-medium">판매자 센터</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="index.html" target="_blank" class="bg-white text-stone-900 text-xs font-bold px-4 py-2 rounded-lg hover:bg-stone-200 transition">
                    📱 쇼핑몰(index.html) 열기
                </a>
                <button onclick="logout()" class="text-xs text-stone-400 hover:text-white underline">로그아웃</button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                    <p class="text-xs text-stone-500">등록된 숏폼 상품 수</p>
                    <p id="stat-products" class="text-2xl font-bold mt-1">0개</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                    <p class="text-xs text-stone-500">총 접수 주문 건수</p>
                    <p id="stat-orders" class="text-2xl font-bold text-rose-600 mt-1">0건</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                    <p class="text-xs text-stone-500">누적 매출액</p>
                    <p id="stat-revenue" class="text-2xl font-bold text-emerald-600 mt-1">0원</p>
                </div>
            </div>

            <!-- 选项卡 -->
            <div class="flex space-x-2 border-b border-stone-300 pb-3">
                <button onclick="switchTab('products', this)" class="tab-btn bg-stone-900 text-white text-xs font-bold px-4 py-2.5 rounded-lg">
                    1. 상품 및 숏폼 영상 관리
                </button>
                <button onclick="switchTab('orders', this)" class="tab-btn bg-white text-stone-600 text-xs font-bold px-4 py-2.5 rounded-lg">
                    2. 주문 내역 및 택배 송장 관리
                </button>
            </div>

            <!-- 商品与短视频管理 -->
            <div id="tab-products" class="grid lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200 space-y-3 h-fit">
                    <h3 class="text-sm font-bold border-b pb-2.5">새 숏폼 상품 등록</h3>
                    <div>
                        <label class="block text-xs text-stone-500 mb-1">카테고리</label>
                        <select id="new-cat" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                            <option value="bra">심리스 브라 (bra)</option>
                            <option value="panty">노라인 팬티 (panty)</option>
                            <option value="set">세트 구성 (set)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-stone-500 mb-1">상품명 *</label>
                        <input id="new-name" type="text" placeholder="예: 에어핏 퓨징 심리스 브라" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-stone-500 mb-1">판매가 (원) *</label>
                            <input id="new-price" type="number" placeholder="24900" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-stone-500 mb-1">배지 태그</label>
                            <input id="new-tag" type="text" placeholder="BEST / 1+1" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-stone-500 mb-1">세로형 MP4 동영상 URL</label>
                        <input id="new-video" type="url" placeholder="비워두면 기본 샘플 영상 적용" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs text-stone-500 mb-1">썸네일 이미지 URL</label>
                        <input id="new-thumb" type="url" placeholder="비워두면 기본 샘플 이미지 적용" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs text-stone-500 mb-1">숏폼 피드 소개글</label>
                        <textarea id="new-desc" rows="2" placeholder="영상 하단에 노출될 설명을 입력하세요." class="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"></textarea>
                    </div>
                    <button onclick="addProduct()" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-3 rounded-lg transition">
                        + 쇼핑몰에 즉시 등록하기
                    </button>
                </div>

                <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                    <div class="flex justify-between items-center border-b pb-2.5 mb-4">
                        <h3 class="text-sm font-bold">등록된 상품 목록 (index.html 실시간 연동)</h3>
                        <button onclick="resetDemoData()" class="text-[11px] text-stone-400 hover:text-stone-700 underline">기본 샘플로 초기화</button>
                    </div>
                    <div id="product-list" class="space-y-3"></div>
                </div>
            </div>

            <!-- 订单管理 -->
            <div id="tab-orders" class="hidden bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-sm font-bold">고객 주문 내역 및 택배 송장 입력</h3>
                    <button onclick="renderAll()" class="text-xs bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded font-medium">🔄 새로고침</button>
                </div>
                <div id="order-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            {
                id: 1, category: 'bra', tag: 'BEST 1',
                name: '에어핏 퓨징 심리스 브라', price: 24900, likes: 1420,
                desc: '쫀득한 텐션감 확인하세요! 말림 없이 하루종일 찰떡 밀착되는 0.1mm 심리스 브라 ✨ #심리스브라 #노와이어',
                colors: ['#E8D8C8', '#2C2A29', '#D8B4A6'],
                thumb: 'https://unsplash.com',
                videoUrl: 'https://mixkit.co'
            },
            {
                id: 2, category: 'panty', tag: '1+1 특가',
                name: '인비저블 노라인 헴팬티', price: 11900, likes: 980,
                desc: '레깅스 입을 때 팬티라인 신경 쓰이셨죠? 레이저 컷팅으로 자국이 1도 안 남아요 👏 #노라인팬티 #운동복필수',
                colors: ['#E8D8C8', '#2C2A29', '#D5C7BC'],
                thumb: 'https://unsplash.com',
                videoUrl: 'https://mixkit.co'
            },
            {
                id: 3, category: 'set', tag: 'SET 할인',
                name: '클라우드 심리스 브라 + 팬티 세트', price: 32900, likes: 2150,
                desc: '가장 문의 많았던 스킨베이지 세트 재입고 완료! 5만원 이상 구매 시 무료배송 혜택까지 🎁 #속옷세트',
                colors: ['#E8D8C8', '#C4A496', '#2C2A29'],
                thumb: 'https://unsplash.com',
                videoUrl: 'https://mixkit.co'
            }
        ];

        function checkLogin() {
            const pw = document.getElementById('admin-pw').value;
            if (pw === '1234') {
